name: monimala_app
description: A new Flutter project for Monimala Store.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.6.0
  provider: ^6.1.2
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_lucide: ^1.1.0
  url_launcher: ^6.2.5
  flutter_spinkit: ^5.2.1
  badges: ^3.1.2
  shimmer: ^3.0.0
  flutter_native_splash: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo_white.png"
  adaptive_icon_background: "#9333EA"
  adaptive_icon_foreground: "assets/images/logo_white.png"

flutter_native_splash:
  color: "#9333EA"
  image: "assets/images/logo_white.png"
  fullscreen: true
  android_12:
    color: "#9333EA"
    icon_background_color: "#9333EA"
    image: "assets/images/logo_white.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/logo.png
    - assets/images/logo_white.png
